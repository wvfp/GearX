[workspace]
resolver = "2"
members = [".", "kernel", "modules/render"]

[package]
name = "gearx"
version = "0.1.0"
edition = "2021"

[dependencies]
gearx_kernel = { path = "kernel" }
gearx_render = { path = "modules/render" }
anyhow = "1"
pollster = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "gearx"
path = "src/main.rs"
