[package]
name = "gearx_assets"
version = "0.1.0"
edition = "2021"
description = "GearX asset management module — texture and mesh caching"

[dependencies]
gearx_kernel = { path = "../../kernel" }
linkme = ">=0.3.32"
anyhow = "1"
tracing = "0.1"
wgpu = "24.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1", features = ["derive"] }
