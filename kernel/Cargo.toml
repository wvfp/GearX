[package]
name = "gearx_kernel"
version = "0.1.0"
edition = "2021"
description = "GearX game engine kernel layer — module system, ECS integration, event bus, resource management, and platform abstraction"

[dependencies]
bevy_ecs = { version = "0.15", default-features = false }
linkme = ">=0.3.32"
glam = "0.29"
raw-window-handle = "0.6"
tracing = "0.1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
web-time = "1"
